[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridiron"
version = "0.2.0"
description = "Autonomous fantasy football agent for Sleeper leagues"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.0",
    "structlog>=24.4.0",
    "playwright>=1.48.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "boto3-stubs[dynamodb,ses,secretsmanager,bedrock-runtime]>=1.35.0",
    "moto[dynamodb]>=5.0.0",
    "respx>=0.21.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "playwright.*", "moto", "respx.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
