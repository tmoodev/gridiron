name: CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src/ tests/

      - name: black check
        run: black --check src/ tests/

      - name: mypy
        run: mypy --strict src/gridiron/

      - name: pytest
        run: pytest tests/ -v
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  deploy:
    needs: [lint-and-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to datatrav-mdc-prod
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          timeout: 120s
          script: |
            set -e
            cd /opt/gridiron

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Fetch Cloudflare tunnel token from Secrets Manager
            export CLOUDFLARE_TUNNEL_TOKEN=$(aws secretsmanager get-secret-value \
              --secret-id digitalmoore/gridiron/cf-tunnel-token \
              --query SecretString --output text --region us-east-1 2>/dev/null || echo "")

            # Build and restart services
            docker compose pull cloudflared 2>/dev/null || true
            docker compose up -d --build --remove-orphans

            # Wait for health check
            sleep 10
            curl -sf http://localhost:8000/api/health | grep -q '"ok"'
            echo "Deploy successful"
