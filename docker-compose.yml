services:
  gridiron-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridiron-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - gridiron-playwright:/root/.playwright
    networks:
      - datatrav-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  gridiron-frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: gridiron-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - datatrav-net
    depends_on:
      - gridiron-backend

  # Cloudflare Tunnel — routes gridiron.datatrav.net → gridiron-frontend:3000
  # Token stored in AWS Secrets Manager at digitalmoore/gridiron/cf-tunnel-token
  # Create tunnel via Cloudflare dashboard: Zero Trust → Tunnels → gridiron
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gridiron-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - datatrav-net
    depends_on:
      - gridiron-frontend

volumes:
  gridiron-playwright:

networks:
  datatrav-net:
    external: true
